<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الإحصائيات</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div style="font-weight:900; font-size:18px;">الإحصائيات</div>
          <div class="badge">حسب الشهر - للمدفوعات المؤكدة</div>
        </div>
      </div>

      <div class="clockbox" style="min-width:220px;">
        <a class="btn" href="index.html">← الرئيسية</a>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="row">
        <div>
          <div style="font-weight:900;">اختيار الشهر</div>
          <div class="mini">نحسب من الحجوزات المؤكدة</div>
        </div>

        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <select id="monthSelect" class="btn" style="padding:10px 12px;">
            <!-- filled by JS -->
          </select>
          <select id="yearSelect" class="btn" style="padding:10px 12px;">
            <!-- filled by JS -->
          </select>
        </div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div style="font-weight:900; font-size:16px; margin-bottom:8px;">ملخص</div>
        <div class="kv">
          <div class="box">
            <div class="mini">عدد الساعات</div>
            <div style="font-weight:900; font-size:20px;" id="statHours">0</div>
          </div>
          <div class="box">
            <div class="mini">عدد الفرق</div>
            <div style="font-weight:900; font-size:20px;" id="statTeams">0</div>
          </div>
          <div class="box">
            <div class="mini">إجمالي المبالغ</div>
            <div style="font-weight:900; font-size:20px;" id="statAmount">0</div>
          </div>
          <div class="box">
            <div class="mini">عدد الحجوزات</div>
            <div style="font-weight:900; font-size:20px;" id="statCount">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:900; font-size:16px; margin-bottom:8px;">معلومة</div>
        <div class="mini" style="line-height:1.9;">
          الإحصائيات يتم حسابها اعتمادًا على <b>الحجوزات المؤكدة</b> (Confirmed).  
          لو تحب نخليها على المؤكدة + المعلقة أو على الجميع قولّي.
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");

    const monthNames = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
    monthNames.forEach((m, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = m;
      monthSelect.appendChild(opt);
    });

    const now = new Date();
    const years = [now.getFullYear(), now.getFullYear()-1, now.getFullYear()-2];
    years.forEach(y => {
      const opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = String(y);
      yearSelect.appendChild(opt);
    });

    monthSelect.value = String(now.getMonth());
    yearSelect.value = String(now.getFullYear());

    function renderStats() {
      const monthIndex0 = Number(monthSelect.value);
      const year = Number(yearSelect.value);

      const confirmed = getConfirmed();
      const s = calcStatsForMonth(confirmed, year, monthIndex0);

      document.getElementById("statHours").textContent = `${s.totalHours}`;
      document.getElementById("statTeams").textContent = `${s.totalTeams}`;
      document.getElementById("statAmount").textContent = `${money(s.totalAmount)}`;
      document.getElementById("statCount").textContent = `${s.countBookings}`;
    }

    monthSelect.addEventListener("change", renderStats);
    yearSelect.addEventListener("change", renderStats);

    renderStats();
  </script>
</body>
</html>
