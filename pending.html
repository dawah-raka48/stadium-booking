<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الحجوزات المعلقة</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div>
          <div style="font-weight:900; font-size:18px;">الحجوزات المعلقة</div>
          <div class="badge">انتظر التأكيد</div>
        </div>
      </div>

      <div class="clockbox" style="min-width:220px;">
        <a class="btn" href="index.html">← الرئيسية</a>
        <a class="btn primary" href="new-booking.html" style="margin-top:6px;">+ حجز جديد</a>
      </div>
    </div>

    <div class="card" style="margin-bottom:12px;">
      <div class="row">
        <div>
          <div style="font-weight:900;">قائمة الحجوزات</div>
          <div class="mini">اضغط على البطاقة لعرض التفاصيل</div>
        </div>
        <button class="btn" type="button" id="refreshBtn">تحديث</button>
      </div>
    </div>

    <div class="accordion" id="pendingList"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.getElementById("refreshBtn").addEventListener("click", () => location.reload());

    const list = getPending();
    renderBookingsToAccordion({
      containerId: "pendingList",
      list,
      mode: "pending"
    });
  </script>
</body>
</html>
